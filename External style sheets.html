
<!DOCTYPE html>
<html>
<head>
<title>External CSS with JavaScript</title>
<!--External CSS-->
<link rel="stylesheet" type="text/css" href="style.css"/>
</head>
<body>
<h1>External Style Sheet Demonstration</h1>
<p id="message">Click the button to change this text.</p>
<button onclick="changeText()">Click Here</button>
</body>
<script>
function changeText(){
document.getElementByID("message").innerHTML="Welcome to JavaScript!";
}
</script>
</html>
